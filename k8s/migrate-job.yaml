# Migration Job — runs once per deploy. Waits for Postgres TCP before starting Node
# so the process does not hang on DNS/connect when DB is slow to become ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: rice
spec:
  backoffLimit: 0
  # Fail the job if it runs longer than this (must be >= deploy.sh kubectl wait timeout)
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      # Same namespace as Service "postgres" — short name resolves via cluster DNS
      dnsPolicy: ClusterFirst
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for TCP postgres:5432 (max ~3m)..."
              i=0
              while [ "$i" -lt 90 ]; do
                if nc -z postgres 5432 2>/dev/null; then
                  echo "Postgres accepts connections."
                  exit 0
                fi
                i=$((i + 1))
                echo "attempt $i/90..."
                sleep 2
              done
              echo "Timeout: postgres not reachable on postgres:5432"
              exit 1
      containers:
        - name: migrate
          image: rice-soft-backend:latest
          imagePullPolicy: Never
          # Explicit env wins over duplicate keys from envFrom (backend-env secret)
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            # Avoid libpq/pg picking up a stray PGHOST from the secret pointing outside the cluster
            - name: PGHOST
              value: postgres
          envFrom:
            - secretRef:
                name: backend-env
          command: ["node", "dist/database/migrations/run-migrations.js"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
